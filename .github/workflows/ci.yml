name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SANITY_DISABLE_REMOTE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build website
        run: npm run build

      - name: Build Studio
        run: npm run build:studio

      - name: Route and contract tests
        run: npm run e2e
